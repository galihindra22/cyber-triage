# One command to run everything:   docker compose up --build
# Ollama (the local AI) stays on the host machine, outside Docker.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - STATE_DIR=/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/code/data   # mitre_map.csv + playbook.csv stay editable on the host
      - state:/state                # database + generated logs
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  state:
